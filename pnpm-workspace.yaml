packages:
  - apps/*
  - packages/*

allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: false

catalog:
  "@changesets/cli": ^3.0.3
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@iconify/types": ^2.0.0
  "@lit/react": ^1.0.8
  "@monaco-editor/react": ^4.7.0
  "@shikijs/monaco": ^4.4.3
  "@shikijs/themes": ^4.4.3
  "@types/node": ^26
  "@types/markdown-it": ^14.2.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/vscode": ^1.134.0
  "@types/hast": ^3.0.4
  "@types/mdast": ^4.0.4
  "@vscode/vsce": ^3.9.2
  "@vitejs/plugin-react": ^6.1.2
  elkjs: 0.12.0
  happy-dom: ^21.0.3
  hast-util-from-html: ^2.0.3
  ignore: ^7.0.13
  lucide-react: ^1.58.0
  markdown-it: ^15.0.3
  monaco-editor: ^0.57.0
  ovsx: ^1.3.0
  rehype-stringify: ^10.0.1
  remark-parse: ^11.0.0
  remark-rehype: ^11.1.2
  react: ^19.3.1
  react-dom: ^19.3.1
  shiki: ^4.5.0
  tinyglobby: ^0.2.17
  unified: ^11.0.5
  unplugin: ^3.3.0
  unist-util-visit: ^5.0.0
  typescript: ^7
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vscode-languageclient: ^10.1.2

catalogMode: prefer

minimumReleaseAge: 0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
