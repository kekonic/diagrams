name: Deploy docs

# Manual recovery / redeploy without a new npm publish.
# Normal path: Release workflow deploys after Changesets publish.

on:
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: kekonic-diagrams
          env-slug: prod
          domain: https://app.infisical.com

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm exec vp install

      # Website imports workspace package exports (e.g. @kekonic/diagrams-ui/shiki → dist/).
      - name: Build workspace packages
        run: pnpm exec vp run -r build

      - name: Build docs site
        run: pnpm exec vp run @kekonic/diagrams-website#build

      # Avoid wrangler-action's npm install in apps/website — npm can't parse workspace:*.
      - name: Deploy docs to Cloudflare Pages
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy dist --project-name=kekonic-diagrams --branch=main
