name: Dependabot auto-merge

# Enables GitHub auto-merge on patch/minor PRs, then rebases open Dependabot
# PRs whenever main moves so "require up to date" can pass without a human.
# pull_request_target is required so the token can write; do not check out PR code.

on:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Enable auto-merge
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

  rebase:
    name: Rebase onto main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Dependabot to rebase PRs that are behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          numbers=$(gh pr list --repo "$REPO" --author "app/dependabot" --state open \
            --json number,mergeStateStatus \
            --jq '.[] | select(.mergeStateStatus == "BEHIND") | .number')
          if [ -z "$numbers" ]; then
            echo "No behind Dependabot PRs"
            exit 0
          fi
          for number in $numbers; do
            gh pr comment "$number" --repo "$REPO" --body "@dependabot rebase"
          done
