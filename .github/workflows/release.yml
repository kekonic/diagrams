name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing npm version whose delivery steps should be resumed
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets needs full history for changelogs.
          fetch-depth: 0

      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: kekonic-diagrams
          env-slug: prod
          domain: https://app.infisical.com

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm exec vp install

      # Fail fast with a clear auth error (Changesets + pnpm can swallow E403 details).
      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Create release PR or publish to npm
        id: changesets
        if: github.event_name == 'push'
        # Action v2 requires @changesets/cli v3. Stay on v1 until the CLI is upgraded.
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
          # One product version (fixed group) → one GitHub Release (see next step).
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # From Infisical (previous step → GITHUB_ENV).
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Resolve release delivery version
        id: delivery
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const requested = process.env.REQUESTED_VERSION?.trim();
          const published = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]");
          const versions = [...new Set(published.map((entry) => entry.version))];
          if (versions.length > 1) {
            throw new Error(`Expected one fixed release version, got: ${versions.join(", ")}`);
          }
          const version = requested || versions[0] || "";
          if (version && !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid release version: ${version}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(version ? `Delivering KDiagram ${version}` : "No new release to deliver");
          NODE

      - name: Verify resumed npm release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ steps.delivery.outputs.version }}
        run: npm view "@kekonic/diagrams@${RELEASE_VERSION}" version

      # changesets/action only supports per-package releases; we use fixed versioning
      # so publish one tag `vX.Y.Z` covering the whole line.
      - name: Create GitHub release
        if: steps.delivery.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          RELEASE_VERSION: ${{ steps.delivery.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          let pkgs = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]");
          const version = process.env.RELEASE_VERSION;
          const tag = `v${version}`;
          const title = `KDiagram ${version}`;
          let exists = false;
          try {
            execFileSync("gh", ["release", "view", tag], { stdio: "ignore" });
            exists = true;
          } catch {
            exists = false;
          }
          if (exists) {
            console.log(`Release ${tag} already exists; skipping`);
            process.exit(0);
          }
          if (pkgs.length === 0) {
            pkgs = fs.readdirSync("packages", { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => `packages/${entry.name}/package.json`)
              .filter((path) => fs.existsSync(path))
              .map((path) => JSON.parse(fs.readFileSync(path, "utf8")))
              .filter((pkg) => !pkg.private && pkg.version === version);
          }
          const packageList = pkgs
            .map((p) => `- \`${p.name}@${p.version}\``)
            .join("\n");

          let changelog = "";
          const changelogPath = "packages/diagrams/CHANGELOG.md";
          if (fs.existsSync(changelogPath)) {
            const md = fs.readFileSync(changelogPath, "utf8");
            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const match = md.match(
              new RegExp(`^## ${escaped}\\n([\\s\\S]*?)(?=\\n## |$)`, "m"),
            );
            if (match) changelog = match[1].trim();
          }

          const body = [
            `## Kekonic Diagrams ${version}`,
            "",
            "### Packages",
            packageList,
            changelog ? `\n${changelog}` : "",
          ]
            .filter(Boolean)
            .join("\n");

          fs.writeFileSync("release-notes.md", `${body}\n`);

          const args = [
            "release",
            "create",
            tag,
            "--target",
            process.env.GITHUB_SHA,
            "--title",
            title,
            "--notes-file",
            "release-notes.md",
          ];
          if (/-(rc|alpha|beta|pre)/i.test(version)) {
            args.push("--prerelease");
          }
          execFileSync("gh", args, { stdio: "inherit" });
          NODE

      - name: Prepare VS Code extension package
        if: steps.delivery.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.delivery.outputs.version }}
        run: |
          artifact="artifacts/diagrams-${RELEASE_VERSION}.vsix"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mkdir -p artifacts
            if gh release download "v${RELEASE_VERSION}" --pattern "diagrams-${RELEASE_VERSION}.vsix" --dir artifacts; then
              echo "Recovered ${artifact} from the existing GitHub release"
              exit 0
            fi
            manifest_version=$(node -p 'require("./apps/diagrams-vscode/package.json").version')
            if [[ "$manifest_version" != "$RELEASE_VERSION" ]]; then
              echo "The VSIX is not attached to v${RELEASE_VERSION}, and this ref contains extension ${manifest_version}" >&2
              echo "Dispatch the workflow from a ref containing extension ${RELEASE_VERSION}" >&2
              exit 1
            fi
          fi
          pnpm exec vp run diagrams#package

      - name: Attach VSIX to GitHub release
        if: steps.delivery.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.delivery.outputs.version }}
        run: |
          gh release upload "v${RELEASE_VERSION}" "artifacts/diagrams-${RELEASE_VERSION}.vsix" --clobber

      # Open VSX / VS Marketplace publishing intentionally deferred (extension not ready).

      - name: Publish stable Homebrew formula
        if: steps.delivery.outputs.version != ''
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          RELEASE_VERSION: ${{ steps.delivery.outputs.version }}
          HOMEBREW_TAP_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
        run: node ./scripts/publish-homebrew-formula.mjs

      - name: Build docs site
        if: steps.delivery.outputs.version != ''
        run: pnpm exec vp run @kekonic/diagrams-website#build

      # Avoid wrangler-action's npm install in apps/website — npm can't parse workspace:*.
      - name: Deploy docs to Cloudflare Pages
        if: steps.delivery.outputs.version != ''
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy dist --project-name=kekonic-diagrams --branch=main
