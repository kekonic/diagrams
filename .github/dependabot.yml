# Dependabot — weekly dependency and Actions upgrades.
# Prefer updating shared versions via pnpm-workspace.yaml `catalog` when reviewing.
# Patch/minor PRs enable GitHub auto-merge; a push to main rebases those that
# are behind. Majors stay open for review.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      lint-and-test:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "typescript"
      lit:
        patterns:
          - "lit"
          - "@lit/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
